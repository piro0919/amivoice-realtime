name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:lib
      - run: pnpm check:package

  # The tests on every Node line the dev toolchain runs on. pnpm 11 needs
  # Node >= 22.13, so older lines only get the load check below.
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The package supports Node 18 and 20, where `/server` runs and the client can
  # run with `ws`. Build on 22 and check both entry points load there, through
  # require and import.
  old-node-load:
    name: load on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node -e "const m = require('amivoice-realtime'); if (typeof m.AmiVoiceRealtimeClient !== 'function') process.exit(1)"
      - run: node --input-type=module -e "const m = await import('amivoice-realtime'); if (typeof m.AmiVoiceRealtimeClient !== 'function') process.exit(1)"
      - run: node -e "const m = require('amivoice-realtime/server'); if (typeof m.createTokenCache !== 'function') process.exit(1)"
      - run: node --input-type=module -e "const m = await import('amivoice-realtime/server'); if (typeof m.createTokenCache !== 'function') process.exit(1)"
